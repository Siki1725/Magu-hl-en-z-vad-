<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26E126">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hlášení">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MAGU – Hlášení problémů</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
:root {
  --ink: #363636;
  --green: #26E126;
  --green-press: #1cd91c;
  --paper: #FAFAFA;
  --white: #ffffff;
  --muted: #a1a19b;
  --line: #e9e9e9;
  --shadow: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font-family: "Helvetica Neue", Inter, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.35;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea { font-family: inherit; color: inherit; }
button {
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
header {
  background: var(--white);
  color: var(--ink);
  padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-bottom: 4px solid var(--green);
  box-shadow: 0 1px 0 rgba(0,0,0,0.04);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.brand svg {
  height: 42px;
  width: auto;
  flex: none;
  display: block;
}
header button {
  flex: none;
  background: var(--white);
  border: 2px solid var(--ink);
  color: var(--ink);
  border-radius: 999px;
  padding: 12px 18px;
  min-height: 52px;
  font-size: 17px;
  font-weight: 700;
  box-shadow: var(--shadow);
}
header button:active {
  background: var(--green);
  border-color: var(--ink);
}
main {
  flex: 1;
  max-width: 1000px;
  width: 100%;
  min-width: 0;
  margin: 0 auto;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  overflow-x: auto;
}
.crumb {
  color: var(--muted);
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 8px;
  min-height: 22px;
}
h1 {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 4px 0 18px;
  text-align: center;
  color: var(--ink);
}
.opts {
  flex: 1;
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  align-content: start;
}
.opts button {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
  padding: 24px 18px;
  border: 2px solid var(--ink);
  background: var(--white);
  color: var(--ink);
  border-radius: 999px;
  min-height: 120px;
  box-shadow: var(--shadow);
}
.opts button:active {
  background: var(--green);
  border-color: var(--ink);
  color: var(--ink);
}
.big .opts { grid-template-columns: 1fr 1fr; }
.big .opts button { font-size: 40px; min-height: 45vh; }
.nav {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}
.nav button {
  flex: 1;
  min-height: 72px;
  padding: 18px 16px;
  font-size: 22px;
  font-weight: 700;
  border-radius: 999px;
  border: 2px solid var(--ink);
  background: var(--white);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.nav button:active { background: var(--green); }
.back { background: var(--white); }
.save {
  background: var(--green);
  color: var(--ink);
  border-color: var(--ink);
  font-size: 24px !important;
  font-weight: 800;
}
.save:active { background: var(--green-press); }
textarea, input {
  width: 100%;
  font-size: 20px;
  padding: 16px 18px;
  border-radius: 20px;
  border: 2px solid var(--ink);
  background: var(--white);
  margin-bottom: 14px;
  min-height: 60px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
textarea { min-height: 110px; resize: vertical; }
textarea:focus, input:focus, button:focus-visible {
  outline: 3px solid var(--green);
  outline-offset: 2px;
}
::placeholder { color: #9e9e9e; }
.sum {
  background: var(--white);
  border-radius: 24px;
  padding: 18px 18px;
  font-size: 20px;
  line-height: 1.7;
  margin-bottom: 16px;
  border: 2px solid var(--line);
  box-shadow: var(--shadow);
}
.sum b { font-weight: 700; }
.ok {
  text-align: center;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--ink);
  background: var(--green);
  border-radius: 28px;
  padding: 36px 18px;
  margin-top: 12vh;
  box-shadow: var(--shadow);
}
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--white);
  font-size: 16px;
  box-shadow: var(--shadow);
}
td, th {
  border: 1px solid var(--line);
  padding: 10px 8px;
  text-align: left;
  vertical-align: top;
}
th {
  background: var(--green);
  color: var(--ink);
  font-weight: 700;
}
tr:nth-child(even) td { background: var(--paper); }
.small {
  min-height: 52px;
  padding: 12px 16px;
  font-size: 17px;
  font-weight: 700;
  margin: 0 8px 12px 0;
  border-radius: 999px;
  border: 2px solid var(--ink);
  background: var(--white);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.small:active { background: var(--green); }
@media (max-width: 600px) {
  .big .opts { grid-template-columns: 1fr; }
  .big .opts button { min-height: 30vh; font-size: 36px; }
  h1 { font-size: 28px; }
  .brand { font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <span class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 768" aria-hidden="true" focusable="false">
      <g transform="translate(0,768) scale(0.1,-0.1)" fill="#363636">
        <path d="M2605 7599 c-116 -11 -196 -34 -312 -89 -543 -258 -960 -856 -1300 -1865 -305 -902 -662 -2548 -808 -3723 -77 -621 -138 -1465 -116 -1588 33 -175 140 -278 290 -278 119 1 222 69 279 187 40 83 49 137 62 367 34 628 113 1252 265 2085 180 986 365 1747 597 2455 296 907 463 1263 718 1534 163 173 357 270 476 237 86 -23 167 -129 207 -271 22 -76 52 -263 77 -470 84 -717 91 -1520 20 -2515 -24 -345 -16 -397 76 -495 61 -65 129 -94 220 -94 132 0 246 79 300 207 13 30 44 157 69 283 115 567 213 874 349 1084 111 171 262 273 359 240 84 -27 176 -183 240 -405 19 -66 58 -219 87 -340 29 -121 61 -242 71 -270 27 -72 85 -142 152 -183 50 -31 68 -36 136 -40 87 -5 138 11 199 63 74 63 100 131 137 359 42 266 80 386 145 459 39 45 64 47 118 7 52 -37 96 -98 205 -282 102 -171 201 -306 319 -435 547 -599 1389 -1026 2283 -1157 216 -32 403 -46 458 -35 156 33 271 168 252 297 -9 62 -50 137 -95 172 -62 49 -125 67 -315 89 -502 59 -882 172 -1285 383 -398 207 -734 499 -972 843 -30 44 -99 154 -153 245 -53 91 -125 203 -158 249 -88 123 -237 273 -331 336 -264 175 -528 121 -716 -147 l-48 -68 -47 87 c-121 223 -252 370 -392 441 -106 52 -172 66 -303 60 -83 -4 -124 -12 -200 -37 -159 -54 -316 -149 -419 -255 -24 -25 -48 -43 -53 -40 -4 3 -8 42 -8 87 0 290 -80 1153 -130 1398 -46 226 -131 408 -251 535 -198 212 -477 320 -754 293z"/>
      </g>
    </svg>
    <span>MAGU – Hlášení problémů</span>
  </span>
  <button id="zaz" type="button">Záznamy</button>
</header>
<main id="app"></main>
<script>
// === Konfigurace – zde doplňte vlastní názvy ===
const TECH=["Nová linka","Myčka B"];
const TYP=["Neočekávaný prostoj","Technická závada"];
const CASTI={"Nová linka":["Část A","Část B","Část C","Část D"],"Myčka B":["Část A","Část B","Část C","Část D"]};
const PROBLEMY=["Problém A","Problém B","Problém C","Problém D","Problém E","Problém F","Problém G","Problém H"];
// ===============================================
let LS;try{LS=window.localStorage;LS.getItem("x")}catch(e){const m={};LS={getItem:k=>m[k]??null,setItem:(k,v)=>m[k]=String(v),removeItem:k=>delete m[k]}}
const KEY="magu_hlaseni",app=document.getElementById("app");let s={},krok=0;
const load=()=>JSON.parse(LS.getItem(KEY)||"[]");
const esc=x=>(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KROKY=[
 {k:"tech",t:"Vyberte stroj",l:()=>TECH,big:1},
 {k:"typ",t:"Typ problému",l:()=>TYP},
 {k:"cast",t:"Na které části stroje?",l:()=>CASTI[s.tech]},
 {k:"co",t:"Co se stalo?",l:()=>PROBLEMY}];
function crumb(){return '<div class="crumb">'+["tech","typ","cast","co"].filter(k=>s[k]).map(k=>esc(s[k])).join(" › ")+'</div>'}
function show(){
 if(krok<4){const K=KROKY[krok];app.className=K.big?"big":"";
  app.innerHTML=crumb()+"<h1>"+K.t+'</h1><div class="opts">'+K.l().map((v,i)=>'<button data-i="'+i+'">'+esc(v)+"</button>").join("")+"</div>"+(krok?'<div class="nav"><button class="back">← Zpět</button></div>':"");
  app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{s[K.k]=K.l()[b.dataset.i];krok++;show()});
 }else{app.className="";
  app.innerHTML='<h1>Kontrola a uložení</h1><div class="sum">Stroj: <b>'+esc(s.tech)+"</b><br>Typ: <b>"+esc(s.typ)+"</b><br>Část: <b>"+esc(s.cast)+"</b><br>Problém: <b>"+esc(s.co)+'</b></div><input id="op" placeholder="Jméno operátora" value="'+esc(LS.getItem("magu_op"))+'"><textarea id="pozn" rows="3" placeholder="Poznámka (nepovinné)"></textarea><div class="nav"><button class="back">← Zpět</button><button class="save">Uložit hlášení</button></div>';
  app.querySelector(".save").onclick=()=>{const op=document.getElementById("op").value;LS.setItem("magu_op",op);const d=load();d.push({cas:new Date().toLocaleString("cs-CZ"),op,...s,pozn:document.getElementById("pozn").value});LS.setItem(KEY,JSON.stringify(d));app.innerHTML='<div class="ok">✔ Hlášení uloženo</div>';s={};krok=0;setTimeout(show,2000)};
 }
 const bk=app.querySelector(".back");if(bk)bk.onclick=()=>{krok--;delete s[KROKY[krok].k];show()};
}
document.getElementById("zaz").onclick=()=>{app.className="";
 app.innerHTML='<h1>Záznamy</h1><div><button class="small" id="nove">← Nové hlášení</button><button class="small" id="csv">Export CSV</button><button class="small" id="clr">Smazat vše</button></div><table><tr><th>Čas</th><th>Operátor</th><th>Stroj</th><th>Typ</th><th>Část</th><th>Problém</th><th>Poznámka</th></tr>'+load().slice().reverse().map(r=>"<tr>"+[r.cas,r.op,r.tech,r.typ,r.cast,r.co,r.pozn].map(x=>"<td>"+esc(x)+"</td>").join("")+"</tr>").join("")+"</table>";
 nove.onclick=()=>{s={};krok=0;show()};
 csv.onclick=()=>{const h=["cas","op","tech","typ","cast","co","pozn"];const t="\ufeff"+["Čas;Operátor;Stroj;Typ;Část;Problém;Poznámka",...load().map(r=>h.map(k=>'"'+(r[k]||"").replace(/"/g,'""')+'"').join(";"))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="hlaseni.csv";a.click()};
 clr.onclick=()=>{if(confirm("Opravdu smazat všechny záznamy?")){LS.removeItem(KEY);zaz.onclick()}};
};
show();
</script>
</body>
</html>
