<style>
:root {
  --ink: #363636;
  --green: #26E126;
  --green-press: #1cd91c;
  --paper: #FAFAFA;
  --white: #ffffff;
  --muted: #a1a19b;
  --line: #e9e9e9;
  --shadow: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
  --over: #C41616;
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font-family: "Helvetica Neue", Inter, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.35;
  -webkit-text-size-adjust: 100%;
}
button, input { font-family: inherit; color: inherit; }
header {
  background: var(--white);
  color: var(--ink);
  padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 4px solid var(--green);
  box-shadow: 0 1px 0 rgba(0,0,0,0.04);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.brand svg {
  height: 42px;
  width: auto;
  flex: none;
  display: block;
}
main {
  flex: 1;
  max-width: 480px;
  width: 100%;
  min-width: 0;
  margin: 0 auto;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}
h1 {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 4px 0 18px;
  text-align: center;
  color: var(--ink);
}
label {
  display: block;
  font-size: 17px;
  font-weight: 700;
  text-align: center;
  margin: 0 0 8px;
}
input {
  width: 100%;
  font-size: 44px;
  font-weight: 800;
  letter-spacing: -0.03em;
  text-align: center;
  font-variant-numeric: tabular-nums;
  padding: 16px 22px;
  border-radius: 999px;
  border: 2px solid var(--ink);
  background: var(--white);
  margin: 0 0 16px;
  min-height: 92px;
  box-shadow: var(--shadow);
  -webkit-appearance: none;
  appearance: none;
}
input:focus {
  outline: 3px solid var(--green);
  outline-offset: 2px;
}
::placeholder { color: #9e9e9e; font-weight: 700; }
.result {
  background: var(--white);
  border: 2px solid var(--ink);
  border-radius: 28px;
  padding: 26px 16px 22px;
  box-shadow: var(--shadow);
  text-align: center;
}
.result.over {
  border-color: var(--over);
}
.pct {
  margin: 0;
  font-size: 52px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.pct.empty { color: var(--muted); }
.fine {
  margin: 8px 0 0;
  min-height: 22px;
  font-size: 16px;
  font-weight: 500;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.limit-note {
  margin: 12px 0 0;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.result.over .pct,
.result.over .fine,
.result.over .limit-note {
  color: var(--over);
}
.calib {
  margin-top: 22px;
  text-align: center;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.5;
}
.calib p { margin: 0; }
.calib .label {
  font-weight: 800;
}
@media (max-width: 600px) {
  h1 { font-size: 28px; }
  .brand { font-size: 16px; }
  .pct { font-size: 48px; }
}

</head>
<body>
<header>
  <span class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 768" aria-hidden="true" focusable="false">
      <g transform="translate(0,768) scale(0.1,-0.1)" fill="#363636">
        <path d="M2605 7599 c-116 -11 -196 -34 -312 -89 -543 -258 -960 -856 -1300 -1865 -305 -902 -662 -2548 -808 -3723 -77 -621 -138 -1465 -116 -1588 33 -175 140 -278 290 -278 119 1 222 69 279 187 40 83 49 137 62 367 34 628 113 1252 265 2085 180 986 365 1747 597 2455 296 907 463 1263 718 1534 163 173 357 270 476 237 86 -23 167 -129 207 -271 22 -76 52 -263 77 -470 84 -717 91 -1520 20 -2515 -24 -345 -16 -397 76 -495 61 -65 129 -94 220 -94 132 0 246 79 300 207 13 30 44 157 69 283 115 567 213 874 349 1084 111 171 262 273 359 240 84 -27 176 -183 240 -405 19 -66 58 -219 87 -340 29 -121 61 -242 71 -270 27 -72 85 -142 152 -183 50 -31 68 -36 136 -40 87 -5 138 11 199 63 74 63 100 131 137 359 42 266 80 386 145 459 39 45 64 47 118 7 52 -37 96 -98 205 -282 102 -171 201 -306 319 -435 547 -599 1389 -1026 2283 -1157 216 -32 403 -46 458 -35 156 33 271 168 252 297 -9 62 -50 137 -95 172 -62 49 -125 67 -315 89 -502 59 -882 172 -1285 383 -398 207 -734 499 -972 843 -30 44 -99 154 -153 245 -53 91 -125 203 -158 249 -88 123 -237 273 -331 336 -264 175 -528 121 -716 -147 l-48 -68 -47 87 c-121 223 -252 370 -392 441 -106 52 -172 66 -303 60 -83 -4 -124 -12 -200 -37 -159 -54 -316 -149 -419 -255 -24 -25 -48 -43 -53 -40 -4 3 -8 42 -8 87 0 290 -80 1153 -130 1398 -46 226 -131 408 -251 535 -198 212 -477 320 -754 293z"/>
      </g>
    </svg>
    <span>MAGU</span>
  </span>
</header>
<main>
  <h1>Kalkulačka alkoholu</h1>
  <label for="raw">Hodnota z alkoholmetru</label>
  <input id="raw" type="text" inputmode="decimal" lang="cs" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="181" aria-describedby="calib">
  <div id="result" class="result" aria-live="polite">
    <p id="pct" class="pct empty">– % obj.</p>
    <p id="fine" class="fine"></p>
    <p id="limit" class="limit-note" hidden></p>
  </div>
  <footer id="calib" class="calib">
    <p class="label" id="calib-label"></p>
  </footer>
</main>
<script id="calc">
/* ============================================================
 * CONFIG — kalibrace alkoholmetru. Po další kalibraci přepište
 * jen tento blok (hodnoty se opisují z rovnice trendline,
 * nejsou dopočítané z tabulky).
 *
 * Sheet: Mikolas Calibration, list „NP Kalibrace 29.9.2026“
 *   C3 Coefficient → a
 *   C4 Exponent    → b
 *   C24 = a * EXP(raw * b)     … zlomek objemu
 *   % obj. = zlomek * 100
 * ============================================================ */
const CONFIG = {
  label: "Kalibrace 29. 9. 2026",
  a: 0.000203,
  b: 0.0104,
  rawMin: 189, // nejnižší kalibrační bod, standard 0,10 %
  rawMax: 441, // nejvyšší kalibrační bod, standard 2,00 %
  limitPercent: 0.35, // limit MAGU pro nealkoholickou kombuchu
  limitNote: "Nad limitem 0,35 %",
};
/* ============================================================ */

function alcoholFraction(raw) {
  return CONFIG.a * Math.exp(raw * CONFIG.b);
}

function alcoholPercent(raw) {
  return alcoholFraction(raw) * 100;
}

function parseRaw(text) {
  if (typeof text !== "string") return null;
  const normalised = text.trim().replace(/\s+/g, "").replace(",", ".");
  if (!/^(?:\d+\.?\d*|\.\d+)$/.test(normalised)) return null;
  const value = Number(normalised);
  return Number.isFinite(value) ? value : null;
}

function formatCzechNumber(n, digits) {
  const negative = n < 0;
  const [whole, frac] = Math.abs(n).toFixed(digits).split(".");
  const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
  const body = frac !== undefined ? grouped + "," + frac : grouped;
  return negative ? "\u2212" + body : body;
}

function formatConstant(n) {
  const stripped = n.toFixed(12).replace(/0+$/, "").replace(/\.$/, "");
  const dot = stripped.indexOf(".");
  const places = dot === -1 ? 0 : stripped.length - dot - 1;
  return formatCzechNumber(n, places);
}

function isOutsideCalibration(raw) {
  return raw < CONFIG.rawMin || raw > CONFIG.rawMax;
}

function exceedsLegalLimit(percent) {
  return percent > CONFIG.limitPercent;
}

if (typeof module !== "undefined" && module && module.exports) {
  module.exports = {
    CONFIG,
    alcoholFraction,
    alcoholPercent,
    parseRaw,
    formatCzechNumber,
    formatConstant,
    isOutsideCalibration,
    exceedsLegalLimit,
  };
}
</script>
<script>
const rawInput = document.getElementById("raw");
const resultEl = document.getElementById("result");
const pctEl = document.getElementById("pct");
const fineEl = document.getElementById("fine");
const limitEl = document.getElementById("limit");

document.getElementById("calib-label").textContent = CONFIG.label;
limitEl.textContent = CONFIG.limitNote;

function render() {
  const raw = parseRaw(rawInput.value);
  if (raw === null) {
    resultEl.classList.remove("over");
    pctEl.textContent = "– % obj.";
    pctEl.classList.add("empty");
    fineEl.textContent = "";
    limitEl.hidden = true;
    return;
  }

  const percent = alcoholPercent(raw);
  if (!Number.isFinite(percent)) {
    resultEl.classList.remove("over");
    pctEl.textContent = "– % obj.";
    pctEl.classList.add("empty");
    fineEl.textContent = "";
    limitEl.hidden = true;
    return;
  }

  const over = exceedsLegalLimit(percent);
  pctEl.classList.remove("empty");
  pctEl.textContent = formatCzechNumber(percent, 2) + " % obj.";
  fineEl.textContent = formatCzechNumber(percent, 3) + " %";
  resultEl.classList.toggle("over", over);
  limitEl.hidden = !over;
}

rawInput.addEventListener("input", render);
render();
</script>
</body>
</html>
